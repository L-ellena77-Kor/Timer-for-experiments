<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1분 간격 측정 타이머</title>
<style>
  :root{
    --ink:#0d1622;
    --panel:#152131;
    --line:#2a3a50;
    --dim:#7d90a8;
    --read:#5ce0bd;
    --warn:#ffc247;
    --alert:#ff6a45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:#eaf1f8;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-feature-settings:"tnum";
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex;align-items:baseline;gap:.9rem;
    padding:1.4vh 3vw;border-bottom:1px solid var(--line);
    color:var(--dim);font-size:clamp(.8rem,1.7vmin,1.15rem);
  }
  header b{color:#eaf1f8;font-weight:600}
  #elapsed{margin-left:auto;font-size:clamp(1rem,2.6vmin,1.8rem);color:#eaf1f8;font-weight:600}
  #elapsed span{color:var(--dim);font-weight:400}

  main{flex:1;display:grid;place-items:center;position:relative}

  .dial{position:relative;width:min(72vh,86vw);aspect-ratio:1}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--line);stroke-width:3}
  .prog{fill:none;stroke:var(--read);stroke-width:6;stroke-linecap:round;
        transition:stroke .3s ease}
  .ticks line{stroke:var(--line);stroke-width:2}

  .center{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:.2em}
  #minute{font-size:clamp(1rem,3.4vmin,2.4rem);color:var(--dim);letter-spacing:.02em}
  #minute b{color:var(--read);font-size:1.6em;font-weight:700;transition:color .3s}
  #sec{
    font-weight:800;line-height:.82;letter-spacing:-.04em;
    font-size:26vmin;
    transition:font-size .45s cubic-bezier(.2,.9,.3,1.4), color .35s ease;
    font-variant-numeric:tabular-nums;
  }
  #unit{font-size:clamp(.9rem,2.4vmin,1.6rem);color:var(--dim)}

  body.warn #sec{color:var(--warn)}
  body.warn .prog{stroke:var(--warn)}
  body.alert #sec{color:var(--alert)}
  body.alert .prog{stroke:var(--alert)}
  body.alert #minute b{color:var(--alert)}

  /* 1분 전환 화면 */
  #flash{
    position:fixed;inset:0;background:var(--read);color:#08141b;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:1vh;
    z-index:20;text-align:center;
  }
  #flash.on{display:flex;animation:pop .5s ease}
  #flash .big{font-size:22vmin;font-weight:800;line-height:.9;letter-spacing:-.04em}
  #flash .msg{font-size:clamp(1.2rem,4.4vmin,3rem);font-weight:600}
  #flash .sub{font-size:clamp(.9rem,2.2vmin,1.4rem);opacity:.65}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  #flash.blink{animation:blink .5s steps(1) 6}
  @keyframes blink{0%,100%{background:var(--read)}50%{background:#a8ffe8}}

  /* 종료 화면 */
  #done{
    position:fixed;inset:0;background:var(--ink);z-index:30;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  }
  #done.on{display:flex}
  #done .t{font-size:clamp(2rem,9vmin,6rem);font-weight:800}
  #done .s{color:var(--dim);font-size:clamp(1rem,2.6vmin,1.6rem)}

  footer{
    display:flex;gap:.6rem;justify-content:center;align-items:center;
    padding:2vh 3vw;border-top:1px solid var(--line);
  }
  button{
    background:transparent;color:#eaf1f8;border:1px solid var(--line);
    border-radius:2px;padding:.7em 1.4em;font:inherit;font-size:clamp(.85rem,1.9vmin,1.15rem);
    cursor:pointer;transition:background .15s,border-color .15s;
  }
  button:hover{background:var(--panel);border-color:var(--dim)}
  button:focus-visible{outline:2px solid var(--read);outline-offset:2px}
  button.primary{border-color:var(--read);color:var(--read)}
  .hint{color:var(--dim);font-size:clamp(.75rem,1.5vmin,.95rem);margin-left:1rem}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <b>측정 타이머</b>
  <span>1분 간격 기록 · 15분 종료</span>
  <div id="elapsed">00:00 <span>/ 15:00</span></div>
</header>

<main>
  <div class="dial">
    <svg viewBox="0 0 200 200">
      <circle class="track" cx="100" cy="100" r="92"/>
      <circle class="prog" id="prog" cx="100" cy="100" r="92"
              stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
      <g class="ticks" id="ticks"></g>
    </svg>
    <div class="center">
      <div id="minute"><b>0</b>분째</div>
      <div id="sec">0</div>
      <div id="unit">초</div>
    </div>
  </div>
</main>

<div id="flash">
  <div class="big" id="flashMin">1분</div>
  <div class="msg">지금 값을 읽고 기록하세요</div>
  <div class="sub">타이머는 계속 가고 있습니다</div>
</div>

<div id="done">
  <div class="t">15분 측정 완료</div>
  <div class="s">기록지를 확인하세요</div>
  <button class="primary" onclick="reset()">처음으로</button>
</div>

<footer>
  <button class="primary" id="btnStart" onclick="toggle()">시작</button>
  <button onclick="reset()">처음으로</button>
  <button onclick="fs()">전체화면</button>
  <span class="hint">스페이스바: 시작·일시정지</span>
</footer>

<script>
const TOTAL = 15 * 60;
const CIRC = 2 * Math.PI * 92;

let startAt = null, pausedAt = null, offset = 0, running = false, lastSec = -1;

const $sec = document.getElementById('sec');
const $min = document.querySelector('#minute b');
const $el  = document.getElementById('elapsed');
const $prog= document.getElementById('prog');
const $flash = document.getElementById('flash');
const $btn = document.getElementById('btnStart');

// 눈금 12개 (5초 간격)
const ticks = document.getElementById('ticks');
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1', 100 + Math.cos(a) * 82);
  l.setAttribute('y1', 100 + Math.sin(a) * 82);
  l.setAttribute('x2', 100 + Math.cos(a) * 87);
  l.setAttribute('y2', 100 + Math.sin(a) * 87);
  ticks.appendChild(l);
}

function toggle(){
  if (running) {
    offset += Date.now() - startAt;
    running = false;
    $btn.textContent = '이어서';
  } else {
    startAt = Date.now();
    running = true;
    $btn.textContent = '일시정지';
  }
}

function reset(){
  running = false; offset = 0; lastSec = -1;
  $btn.textContent = '시작';
  document.getElementById('done').classList.remove('on');
  $flash.classList.remove('on','blink');
  document.body.className = '';
  render(0);
}

function fs(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

function pad(n){ return String(n).padStart(2,'0'); }

function render(t){
  const m = Math.floor(t / 60), s = t % 60;
  $sec.textContent = s;
  $min.textContent = m;
  $el.innerHTML = pad(m) + ':' + pad(s) + ' <span>/ 15:00</span>';
  $prog.setAttribute('stroke-dashoffset', CIRC - (s / 60) * CIRC);

  // 55초부터 숫자 확대 + 색 경고
  document.body.className = '';
  if (s >= 55) {
    const step = s - 55;                    // 0~4
    $sec.style.fontSize = (30 + step * 6) + 'vmin';
    document.body.className = s >= 58 ? 'alert' : 'warn';
  } else {
    $sec.style.fontSize = '26vmin';
  }
}

function fire(m){
  document.getElementById('flashMin').textContent = m + '분';
  $flash.classList.add('on','blink');
  setTimeout(() => $flash.classList.remove('on','blink'), 4000);
}

function tick(){
  if (running) {
    const t = Math.floor((offset + Date.now() - startAt) / 1000);

    if (t >= TOTAL) {
      running = false; offset = TOTAL * 1000;
      render(TOTAL);
      $flash.classList.remove('on','blink');
      document.getElementById('done').classList.add('on');
      $btn.textContent = '시작';
      requestAnimationFrame(tick);
      return;
    }

    if (t !== lastSec) {
      render(t);
      if (t > 0 && t % 60 === 0) fire(t / 60);
      lastSec = t;
    }
  }
  requestAnimationFrame(tick);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
});

render(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
